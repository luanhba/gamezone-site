<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamezone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <div class="logo" aria-label="Gamezone">
            <span class="brand-mark">G</span>
            <span class="brand-text">Gamezone</span>
        </div>

        <nav aria-label="Navegação principal">
            <a href="#">Home</a>
            <a href="./quemsomos.html">Quem Somos</a>
            <a href="./contatos.html">Contatos</a>
        </nav>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1>Gamezone</h1>
            <p>A sua loja de jogos favorita</p>
            <p>Com os melhores preços do mercado</p>
            <button type="button">Venha nos conhecer</button>
        </div>
    </main>

<section class="promocoes">
  <article class="card">
    <img src="imagens/dispatch.png" alt="Jogo em promoção">
    <h3>Dispatch</h3>
    <p>R$ 89,90</p>
    <button>Comprar</button>
  </article>

  <article class="card">
    <img src="imagens/pc.png" alt="Computador em promoção">
    <h3>Computador Gamer</h3>
    <p>R$ 3.499,00</p>
    <button>Comprar</button>
  </article>

  <article class="card">
    <img src="imagens/xbox.png" alt="Outro jogo em promoção">
    <h3>Console + Jogo</h3>
    <p>R$ 2.199,00</p>
    <button>Comprar</button>
  </article>
</section>
</body>
</html>
