<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamezone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topo">
        <div class="logo">
            <span class="bolinha">G</span>
            <span>Gamezone</span>
        </div>

        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="quemsomos.html">Quem Somos</a></li>
            <li><a href="contatos.html">Contatos</a></li>
        </ul>
    </div>

    <div class="banner">
        <h1>Gamezone</h1>
        <p>A sua loja de jogos favorita</p>
        <p>Com os melhores preços</p>
        <button>Venha nos conhecer</button>
    </div>

    <div class="produtos">
        <div class="produto">
            <img src="dispatch.png" alt="Dispatch">
            <h3>Dispatch</h3>
            <p>R$ 89,90</p>
            <button>Comprar</button>
        </div>

        <div class="produto">
            <img src="pc.png" alt="Computador gamer">
            <h3>Computador Gamer</h3>
            <p>R$ 3.499,00</p>
            <button>Comprar</button>
        </div>

        <div class="produto">
            <img src="xbox.png" alt="Console">
            <h3>Console + Jogo</h3>
            <p>R$ 2.199,00</p>
            <button>Comprar</button>
        </div>
    </div>
</body>
</html>
